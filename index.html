<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>·</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=Outfit:wght@300;500;700&family=Sora:wght@400;700&family=Playfair+Display:wght@500;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@500;800&family=Dancing+Script:wght@600&family=Unbounded:wght@400;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --accent:#7c5cff;
  --text:#edeef5;
  --dim:#9aa0b5;
  --card-bg:rgba(13,14,22,.55);
  --card-blur:18px;
  --card-radius:22px;
  --card-border:rgba(255,255,255,.09);
  --card-glow:0px;
  --card-w:420px;
  --font-name:"Space Grotesk";
  --font-body:"Inter";
  --avatar:104px;
  --icon:26px;
  --pad:28px;
  --p-bg:#0d0f14; --p-surface:#151821; --p-raise:#1e2230; --p-line:#252a36;
  --p-text:#e8eaf0; --p-dim:#8b93a7; --p-accent:#7c5cff; --p-on:#2fe0b8; --p-warn:#ffb020;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#05060a;
  color:var(--text);
  font-family:var(--font-body),system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* ---------- arrière-plan ---------- */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#05060a}
#bg .layer{position:absolute;inset:0}
#bgmedia{width:100%;height:100%;object-fit:cover;display:block}
#aurora{
  background:
    radial-gradient(38vmax 38vmax at 18% 18%, color-mix(in srgb, var(--accent) 55%, transparent), transparent 62%),
    radial-gradient(34vmax 34vmax at 82% 74%, rgba(43,217,198,.42), transparent 64%),
    radial-gradient(44vmax 30vmax at 50% 110%, rgba(255,90,160,.22), transparent 70%);
  filter:blur(24px);
  animation:drift 26s ease-in-out infinite alternate;
}
@keyframes drift{
  0%{transform:translate3d(-4%,-3%,0) scale(1.05)}
  50%{transform:translate3d(3%,4%,0) scale(1.14)}
  100%{transform:translate3d(-2%,5%,0) scale(1.02)}
}
#dim{position:fixed;inset:0;z-index:1;background:#000;opacity:.35;pointer-events:none}
#grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;mix-blend-mode:overlay}
#fx{position:fixed;inset:0;z-index:3;pointer-events:none}

/* ---------- carte ---------- */
#stage{
  position:relative;z-index:4;height:100%;
  display:flex;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));
  overflow:auto;
  transition:transform .45s cubic-bezier(.22,.8,.3,1);
}
#card{
  width:100%;max-width:var(--card-w);
  background:var(--card-bg);
  -webkit-backdrop-filter:blur(var(--card-blur)) saturate(1.3);
  backdrop-filter:blur(var(--card-blur)) saturate(1.3);
  border:1px solid var(--card-border);
  border-radius:var(--card-radius);
  padding:var(--pad);
  text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.55), 0 0 var(--card-glow) color-mix(in srgb, var(--accent) 60%, transparent);
  transform-style:preserve-3d;
  will-change:transform;
}
#card.left{text-align:left}
#card.left #links,#card.left #badges{justify-content:flex-start}
#card.left #avatarWrap{margin-left:0;margin-right:auto}

#avatarWrap{position:relative;width:var(--avatar);height:var(--avatar);margin:0 auto 16px;display:none}
#avatarWrap.on{display:block}
#avatar{width:100%;height:100%;object-fit:cover;display:block;background:#15161f}
#avatarWrap[data-shape="circle"] #avatar{border-radius:50%}
#avatarWrap[data-shape="rounded"] #avatar{border-radius:26%}
#avatarWrap[data-shape="square"] #avatar{border-radius:4px}
#avatarWrap[data-shape="hex"] #avatar{clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
#avatarWrap.ring::after{
  content:"";position:absolute;inset:-4px;border-radius:inherit;
  border:2px solid var(--accent);pointer-events:none;
}
#avatarWrap[data-shape="circle"].ring::after{border-radius:50%}
#avatarWrap[data-shape="rounded"].ring::after{border-radius:28%}
#avatarWrap.glow{filter:drop-shadow(0 0 18px color-mix(in srgb, var(--accent) 70%, transparent))}

#name{
  font-family:var(--font-name),system-ui,sans-serif;
  font-size:clamp(26px,7vw,36px);font-weight:700;letter-spacing:-.02em;
  margin:0;line-height:1.1;position:relative;display:inline-block;
}
#title{margin:8px 0 0;color:var(--dim);font-size:14px;min-height:1.2em;letter-spacing:.01em}
#title .caret{display:inline-block;width:1px;margin-left:2px;background:currentColor;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#bio{margin:14px 0 0;color:var(--text);opacity:.85;font-size:14.5px;line-height:1.6;white-space:pre-wrap;max-width:62ch}
#card.left #bio{margin-left:0}

#badges{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:14px 0 0}
#badges:empty{display:none}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:999px;font-size:12px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:var(--dim);
}

#links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0 0}
#links:empty{display:none}
.lk{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:calc(var(--icon) + 20px);height:calc(var(--icon) + 20px);
  border-radius:14px;transition:transform .18s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
  color:var(--text);
}
.lk svg{width:var(--icon);height:var(--icon);display:block;fill:currentColor}
.lk:hover{transform:translateY(-3px);color:var(--brand);box-shadow:0 8px 22px color-mix(in srgb, var(--brand) 32%, transparent)}
#links[data-style="glass"] .lk{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08)}
#links[data-style="outline"] .lk{border:1px solid var(--card-border)}
#links[data-style="solid"] .lk{background:color-mix(in srgb, var(--brand) 22%, transparent);border:1px solid color-mix(in srgb, var(--brand) 34%, transparent)}
#links[data-style="plain"] .lk{background:none;border:none}
#links[data-color="brand"] .lk{color:var(--brand)}
#links[data-color="accent"] .lk{color:var(--accent)}
#links[data-color="dim"] .lk{color:var(--dim)}
#links[data-pill="1"] .lk{width:auto;padding:0 16px;gap:9px}
#links[data-pill="1"] .lk .lbl{font-size:13.5px;font-weight:500}
#links .lk .lbl{display:none}
#links[data-pill="1"] .lk .lbl{display:inline}

/* effets sur le pseudo */
#name.fx-glow{text-shadow:0 0 22px color-mix(in srgb, var(--accent) 75%, transparent)}
#name.fx-gradient{
  background:linear-gradient(90deg,var(--accent),#2bd9c6,#ff5aa0,var(--accent));
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:slide 7s linear infinite;
}
@keyframes slide{to{background-position:300% 0}}
#name.fx-shine{
  background:linear-gradient(100deg,var(--text) 38%,#fff 50%,var(--text) 62%);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:slide 3.6s linear infinite;
}
#name.fx-glitch::before,#name.fx-glitch::after{
  content:attr(data-text);position:absolute;left:0;top:0;width:100%;
}
#name.fx-glitch::before{color:#ff4d6d;transform:translate(-2px,0);clip-path:inset(0 0 55% 0);animation:g1 2.6s infinite steps(2)}
#name.fx-glitch::after{color:#33e8ff;transform:translate(2px,0);clip-path:inset(58% 0 0 0);animation:g2 3.1s infinite steps(2)}
@keyframes g1{0%,88%{opacity:0}89%,93%{opacity:.85;transform:translate(-3px,1px)}94%,100%{opacity:0}}
@keyframes g2{0%,82%{opacity:0}83%,88%{opacity:.85;transform:translate(3px,-1px)}89%,100%{opacity:0}}

/* ---------- lecteur audio ---------- */
#audiobar{
  position:fixed;z-index:6;display:none;align-items:center;gap:11px;
  padding:9px 14px 9px 10px;border-radius:999px;
  background:rgba(10,11,17,.6);border:1px solid rgba(255,255,255,.09);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  max-width:min(320px,calc(100vw - 32px));
}
#audiobar.on{display:flex}
#audiobar[data-pos="bl"]{left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#audiobar[data-pos="br"]{right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#audiobar[data-pos="tl"]{left:16px;top:calc(16px + env(safe-area-inset-top,0px))}
#audiobar[data-pos="tc"]{left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px))}
#playBtn{
  width:34px;height:34px;flex:0 0 34px;border-radius:50%;border:none;cursor:pointer;
  background:var(--accent);color:#fff;display:grid;place-items:center;
}
#playBtn svg{width:15px;height:15px;fill:currentColor}
#trackMeta{min-width:0;flex:1}
#trackName{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#trackSub{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vol{width:64px;flex:0 0 64px;accent-color:var(--accent)}
#skipBtn{background:none;border:none;cursor:pointer;color:var(--dim);padding:2px;display:none}
#skipBtn.on{display:block}
#skipBtn svg{width:15px;height:15px;fill:currentColor}

/* ---------- écran d'entrée ---------- */
#enter{
  position:fixed;inset:0;z-index:20;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:10px;
  cursor:pointer;background:rgba(4,5,9,.42);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  text-align:center;padding:24px;
}
#enter.on{display:flex}
#enter.out{animation:fadeout .5s ease forwards}
@keyframes fadeout{to{opacity:0;visibility:hidden}}
#enterTitle{font-family:var(--font-name),sans-serif;font-size:clamp(22px,6vw,30px);font-weight:700;letter-spacing:-.01em;animation:pulse 2.6s ease-in-out infinite}
#enterSub{color:var(--dim);font-size:13px}
@keyframes pulse{50%{opacity:.55}}

/* ---------- curseur ---------- */
.cur{position:fixed;z-index:60;pointer-events:none;border-radius:50%;left:0;top:0;will-change:transform}
#curDot{width:7px;height:7px;background:var(--accent);margin:-3.5px 0 0 -3.5px}
#curRing{width:30px;height:30px;border:1.5px solid color-mix(in srgb,var(--accent) 70%, transparent);margin:-15px 0 0 -15px;transition:width .2s,height .2s}
#curGlow{width:220px;height:220px;margin:-110px 0 0 -110px;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,transparent),transparent 65%)}
body.cursor-hide,body.cursor-hide *{cursor:none !important}

/* ---------- bouton panel ---------- */
#gear{
  position:fixed;z-index:30;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:44px;height:44px;border-radius:14px;cursor:pointer;display:none;place-items:center;
  background:rgba(12,14,20,.72);border:1px solid rgba(255,255,255,.12);color:#cfd3e0;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  opacity:.4;transition:opacity .2s ease, transform .2s ease;
}
#gear.on{display:grid}
#gear:hover{opacity:1;transform:translateY(-2px)}
#gear svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7}
#gear.dirty::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--p-warn);border:2px solid #0d0f14}

/* ---------- panel ---------- */
#panel{
  position:fixed;z-index:50;top:0;right:0;height:100%;width:min(440px,100vw);
  background:var(--p-bg);border-left:1px solid var(--p-line);
  font-family:"Space Grotesk",system-ui,sans-serif;color:var(--p-text);
  display:flex;flex-direction:column;
  transform:translateX(102%);transition:transform .38s cubic-bezier(.22,.8,.3,1);
  box-shadow:-30px 0 80px rgba(0,0,0,.5);
  font-variant-numeric:tabular-nums;
}
#panel.open{transform:none}
.ph{
  position:relative;
  display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;
  border-bottom:1px solid var(--p-line);flex:0 0 auto;
}
.ph h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;flex:1}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--p-dim)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--p-on);display:block}
.status.dirty i{background:var(--p-warn)}
.status.dirty{color:var(--p-warn)}
.iconbtn{background:none;border:1px solid var(--p-line);border-radius:9px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--p-dim)}
.iconbtn:hover{color:var(--p-text);border-color:#39404f}
.iconbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}

.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px;border-bottom:1px solid var(--p-line);flex:0 0 auto}
.tab{
  flex:1 1 30%;padding:8px 6px;border-radius:9px;border:1px solid transparent;background:none;
  cursor:pointer;color:var(--p-dim);font-size:12.5px;font-weight:500;text-align:center;
}
.tab:hover{color:var(--p-text);background:var(--p-surface)}
.tab.sel{background:var(--p-raise);color:var(--p-text);border-color:#333a4a}

.body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 0 18px}
.sect{display:none}
.sect.sel{display:block}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid #1b1f29;min-height:52px}
.row:last-child{border-bottom:none}
.row .lab{flex:1;min-width:0}
.row .lab b{display:block;font-size:13px;font-weight:500}
.row .lab span{display:block;font-size:11.5px;color:var(--p-dim);margin-top:2px;line-height:1.4}
.row.stack{display:block}
.row.stack .lab{margin-bottom:9px}
.ctl{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.hint{padding:11px 16px;font-size:11.5px;color:var(--p-dim);line-height:1.55;background:#11141b;border-bottom:1px solid #1b1f29}
.hint b{color:var(--p-text);font-weight:500}

input[type=text],textarea,select{
  background:var(--p-surface);border:1px solid var(--p-line);border-radius:9px;
  padding:8px 10px;font-size:13px;width:100%;
}
input[type=text]:focus,textarea:focus,select:focus{border-color:#3d4557;outline:none}
.row .ctl input[type=text]{width:168px}
textarea{resize:vertical;min-height:76px;line-height:1.5;font-family:inherit}
select{cursor:pointer;width:168px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--p-dim) 50%),linear-gradient(135deg,var(--p-dim) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}

.seg{display:flex;background:var(--p-surface);border:1px solid var(--p-line);border-radius:9px;padding:2px;gap:2px}
.seg button{border:none;background:none;cursor:pointer;color:var(--p-dim);font-size:12px;padding:5px 9px;border-radius:7px}
.seg button.sel{background:var(--p-raise);color:var(--p-text)}

.sw{position:relative;width:40px;height:23px;flex:0 0 40px;border-radius:999px;background:#2a3040;border:none;cursor:pointer;transition:background .18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#7c8496;transition:transform .18s,background .18s}
.sw.on{background:color-mix(in srgb,var(--p-on) 30%,#2a3040)}
.sw.on::after{transform:translateX(17px);background:var(--p-on)}

.rng{display:flex;align-items:center;gap:9px}
.rng input{width:132px;-webkit-appearance:none;appearance:none;background:none;height:18px;cursor:pointer}
.rng input::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:#2a3040}
.rng input::-moz-range-track{height:3px;border-radius:2px;background:#2a3040}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5px;border-radius:3px;background:var(--p-accent)}
.rng input::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:3px;background:var(--p-accent)}
.rng .val{font-size:11.5px;color:var(--p-dim);width:46px;text-align:right}

.clr{display:flex;align-items:center;gap:8px}
.clr input[type=color]{width:30px;height:30px;padding:0;border:1px solid var(--p-line);border-radius:8px;background:none;cursor:pointer}
.clr input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
.clr input[type=color]::-webkit-color-swatch{border:none;border-radius:6px}
.row .ctl .clr input[type=text]{width:92px;font-size:12px}

.drop{
  border:1px dashed #333a4a;border-radius:11px;padding:14px;display:flex;align-items:center;gap:12px;
  cursor:pointer;background:var(--p-surface);
}
.drop:hover{border-color:#4a5468}
.drop .thumb{width:46px;height:46px;border-radius:9px;background:#0c0e14;flex:0 0 46px;overflow:hidden;display:grid;place-items:center;color:var(--p-dim);font-size:10.5px}
.drop .thumb img,.drop .thumb video{width:100%;height:100%;object-fit:cover}
.drop .t{flex:1;min-width:0;font-size:12.5px}
.drop .t small{display:block;color:var(--p-dim);font-size:11px;margin-top:3px}
.drop .x{border:none;background:none;color:var(--p-dim);cursor:pointer;font-size:17px;line-height:1;padding:4px}
.drop .x:hover{color:#ff6b81}

.lkrow{display:flex;align-items:center;gap:7px;padding:9px 16px;border-bottom:1px solid #1b1f29}
.lkrow select{width:104px;flex:0 0 104px;font-size:12px;padding:7px 8px;background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%}
.lkrow input{flex:1;min-width:0;font-size:12px;padding:7px 8px}
.lkrow .mini{border:1px solid var(--p-line);background:var(--p-surface);border-radius:7px;width:26px;height:28px;display:grid;place-items:center;cursor:pointer;color:var(--p-dim);font-size:12px;flex:0 0 26px}
.lkrow .mini:hover{color:var(--p-text)}
.lkrow .mini.del:hover{color:#ff6b81;border-color:#5a2b33}

.btn{
  border:1px solid var(--p-line);background:var(--p-surface);border-radius:10px;
  padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;
}
.btn:hover{border-color:#3d4557;background:var(--p-raise)}
.btn.pri{background:var(--p-accent);border-color:var(--p-accent);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.pri:disabled{opacity:.4;cursor:default;filter:none}
.btn.danger:hover{border-color:#5a2b33;color:#ff6b81}
.btn.full{width:100%;text-align:center}

.pf{
  flex:0 0 auto;border-top:1px solid var(--p-line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:10px;background:#0b0d12;
}
.meter{flex:1;min-width:0}
.meter .bar{height:3px;border-radius:2px;background:#232833;overflow:hidden;margin-top:6px}
.meter .bar i{display:block;height:100%;background:var(--p-on);width:0;transition:width .3s}
.meter .bar i.warn{background:var(--p-warn)}
.meter .bar i.bad{background:#ff6b81}
.meter .t{font-size:11px;color:var(--p-dim)}

#toast{
  position:fixed;z-index:70;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:#11141b;border:1px solid var(--p-line);border-radius:11px;
  padding:10px 16px;font-size:13px;font-family:"Space Grotesk",sans-serif;color:var(--p-text);
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;white-space:nowrap;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:640px){
  #panel{width:100%;height:88%;top:auto;bottom:0;border-left:none;border-top:1px solid var(--p-line);border-radius:18px 18px 0 0;transform:translateY(102%)}
  #panel.open{transform:none}
  .ph{padding-top:16px}
  .ph::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:2px;background:#2d3340}
  .row .ctl input[type=text],select{width:140px}
  .rng input{width:104px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>

function $(s,r){return (r||document).querySelector(s)}
function el(t,c,h){var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e}
function clone(o){return JSON.parse(JSON.stringify(o))}
function deepMerge(base,over){
  var out=clone(base);
  if(!over||typeof over!=="object") return out;
  Object.keys(over).forEach(function(k){
    var b=out[k], o=over[k];
    if(o&&typeof o==="object"&&!Array.isArray(o)&&b&&typeof b==="object"&&!Array.isArray(b)) out[k]=deepMerge(b,o);
    else if(o!==undefined) out[k]=clone(o);
  });
  return out;
}
function get(p){return p.split(".").reduce(function(a,k){return a==null?a:a[k]},cfg)}
function set(p,v){var ks=p.split("."),o=cfg;for(var i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v}
function hex2rgb(h){h=(h||"#000").replace("#","");if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];var n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
function rgba(h,a){var c=hex2rgb(h);return"rgba("+c[0]+","+c[1]+","+c[2]+","+a+")"}
function bytes(n){return n<1024?n+" o":n<1048576?(n/1024).toFixed(0)+" Ko":(n/1048576).toFixed(2)+" Mo"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

var twT;
function startTypewriter(){
  clearTimeout(twT);
  var node=$("#title"); if(!node) return;
  var f=cfg.fx;
  var list=(f.phrases||"").split("\n").map(function(s){return s.trim()}).filter(Boolean);
  if(!f.typewriter || !list.length){ node.textContent=cfg.profile.title||""; return; }
  if(window.matchMedia("(prefers-reduced-motion:reduce)").matches){ node.textContent=list[0]; return; }
  var i=0,j=0,del=false;
  node.innerHTML='<span class="txt"></span><span class="caret">&nbsp;</span>';
  var txt=$(".txt",node);
  (function step(){
    var s=list[i];
    j = del ? j-1 : j+1;
    txt.textContent=s.slice(0,j);
    var wait=del?42:75;
    if(!del&&j===s.length){ del=true; wait=1500; }
    else if(del&&j===0){ del=false; i=(i+1)%list.length; wait=280; }
    twT=setTimeout(step,wait);
  })();
}

var tiltBound=false;
function setupTilt(){
  var c=$("#card"); if(!c) return;
  c.style.transform=""; c.style.transition="";
  if(tiltBound) return; tiltBound=true;
  c.addEventListener("mouseenter",function(){
    if(!cfg.fx.tilt) return;
    c.style.transition="transform .12s ease-out";
  },{passive:true});
  c.addEventListener("mousemove",function(e){
    if(!cfg.fx.tilt || window.matchMedia("(pointer:coarse)").matches) return;
    var r=c.getBoundingClientRect();
    var x=(e.clientX-(r.left+r.width/2))/r.width;
    var y=(e.clientY-(r.top+r.height/2))/r.height;
    c.style.transform="perspective(900px) rotateY("+(x*7).toFixed(2)+"deg) rotateX("+(-y*7).toFixed(2)+"deg)";
  },{passive:true});
  c.addEventListener("mouseleave",function(){
    c.style.transition="transform .55s cubic-bezier(.22,.8,.3,1)";
    c.style.transform="";
  },{passive:true});
}

/* =======================================================================
   6. EFFETS CANVAS
   ======================================================================= */
var cv=$("#fx"), ctx=cv.getContext("2d"), parts=[], raf=null, W=0,H=0,DPR=1;
var GLYPHS="ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ0123456789";

function sizeCanvas(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var w=cv.clientWidth, h=cv.clientHeight;
  if(w===W && h===H && dpr===DPR) return false;
  DPR=dpr; W=w; H=h;
  cv.width=W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  return true;
}
function rnd(a,b){return a+Math.random()*(b-a)}

function seed(){
  parts=[];
  var s=cfg.fx.scene, n, d=cfg.fx.density/50;
  if(s==="none") return;
  if(s==="matrix"){
    var cols=Math.floor(W/16);
    for(var c=0;c<cols;c++) parts.push({x:c*16,y:rnd(-H,0),sp:rnd(2,7)});
    return;
  }
  n=Math.round((W*H)/14000*d);
  n=Math.max(10,Math.min(n,420));
  for(var i=0;i<n;i++){
    if(s==="snow") parts.push({x:rnd(0,W),y:rnd(0,H),r:rnd(1,3.2),sp:rnd(.3,1.1),sw:rnd(0,6.28),o:rnd(.25,.85)});
    else if(s==="rain") parts.push({x:rnd(0,W),y:rnd(0,H),l:rnd(8,20),sp:rnd(6,14),o:rnd(.15,.5)});
    else if(s==="stars") parts.push({x:rnd(0,W),y:rnd(0,H),r:rnd(.5,1.7),ph:rnd(0,6.28),sp:rnd(.15,.5),o:rnd(.3,1)});
    else if(s==="dust") parts.push({x:rnd(0,W),y:rnd(0,H),r:rnd(1,2.6),vx:rnd(-.25,.25),vy:rnd(-.35,-.05),o:rnd(.15,.5)});
    else if(s==="embers") parts.push({x:rnd(0,W),y:rnd(0,H+40),r:rnd(.8,2.2),vy:rnd(.4,1.4),sw:rnd(0,6.28),o:rnd(.3,.9)});
    else if(s==="bubbles") parts.push({x:rnd(0,W),y:rnd(0,H),r:rnd(4,17),vy:rnd(.25,.8),sw:rnd(0,6.28),o:rnd(.06,.2)});
  }
}

function frame(){
  var f=cfg.fx, s=f.scene, sp=f.speed/50, col=f.color;
  if(s==="matrix"){
    ctx.globalCompositeOperation="destination-out";
    ctx.fillStyle="rgba(0,0,0,.14)"; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="source-over";
    ctx.font="14px 'JetBrains Mono',monospace"; ctx.fillStyle=col;
    for(var m=0;m<parts.length;m++){
      var p=parts[m];
      ctx.globalAlpha=.85;
      ctx.fillText(GLYPHS[(Math.random()*GLYPHS.length)|0],p.x,p.y);
      p.y+=p.sp*sp*1.6;
      if(p.y>H+20&&Math.random()>.975){p.y=rnd(-120,-20)}
    }
    ctx.globalAlpha=1;
    raf=requestAnimationFrame(frame); return;
  }
  ctx.clearRect(0,0,W,H);
  var rgb=hex2rgb(col), base="rgba("+rgb[0]+","+rgb[1]+","+rgb[2]+",";
  for(var i=0;i<parts.length;i++){
    var q=parts[i];
    if(s==="snow"){
      q.y+=q.sp*sp; q.sw+=.012*sp; q.x+=Math.sin(q.sw)*.5;
      if(q.y>H+5){q.y=-5;q.x=rnd(0,W)}
      ctx.beginPath(); ctx.fillStyle=base+q.o+")"; ctx.arc(q.x,q.y,q.r,0,6.283); ctx.fill();
    } else if(s==="rain"){
      q.y+=q.sp*sp; q.x+=q.sp*sp*.12;
      if(q.y>H){q.y=-20;q.x=rnd(-40,W)}
      ctx.strokeStyle=base+q.o+")"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(q.x,q.y); ctx.lineTo(q.x-q.l*.12,q.y-q.l); ctx.stroke();
    } else if(s==="stars"){
      q.ph+=.02*q.sp*sp;
      var a=q.o*(.45+.55*Math.abs(Math.sin(q.ph)));
      ctx.beginPath(); ctx.fillStyle=base+a.toFixed(3)+")"; ctx.arc(q.x,q.y,q.r,0,6.283); ctx.fill();
    } else if(s==="dust"){
      q.x+=q.vx*sp; q.y+=q.vy*sp;
      if(q.y<-10){q.y=H+10;q.x=rnd(0,W)}
      if(q.x<-10)q.x=W+10; if(q.x>W+10)q.x=-10;
      var g=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,q.r*4);
      g.addColorStop(0,base+q.o+")"); g.addColorStop(1,base+"0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(q.x,q.y,q.r*4,0,6.283); ctx.fill();
    } else if(s==="embers"){
      q.y-=q.vy*sp; q.sw+=.03*sp; q.x+=Math.sin(q.sw)*.4;
      if(q.y<-10){q.y=H+10;q.x=rnd(0,W)}
      var fl=q.o*(.5+.5*Math.sin(q.sw*2));
      ctx.beginPath(); ctx.fillStyle=base+fl.toFixed(3)+")"; ctx.arc(q.x,q.y,q.r,0,6.283); ctx.fill();
    } else if(s==="bubbles"){
      q.y-=q.vy*sp; q.sw+=.015*sp; q.x+=Math.sin(q.sw)*.6;
      if(q.y<-30){q.y=H+30;q.x=rnd(0,W)}
      ctx.beginPath(); ctx.strokeStyle=base+q.o+")"; ctx.lineWidth=1;
      ctx.arc(q.x,q.y,q.r,0,6.283); ctx.stroke();
    }
  }
  raf=requestAnimationFrame(frame);
}

var fxSig="";
function applyFx(){
  sizeCanvas();
  var f=cfg.fx, sig=f.scene+"|"+f.density+"|"+W+"x"+H;
  if(sig===fxSig && raf) return;
  fxSig=sig;
  if(raf){cancelAnimationFrame(raf);raf=null}
  ctx.clearRect(0,0,W,H);
  if(f.scene==="none"){ parts=[]; return; }
  seed();
  if(window.matchMedia("(prefers-reduced-motion:reduce)").matches){
    var save=f.speed; f.speed=0; frame(); cancelAnimationFrame(raf); raf=null; f.speed=save; return;
  }
  frame();
}
window.addEventListener("resize",function(){ applyFx(); },{passive:true});

var curEls=[], curBound=false, mx=0,my=0, rx=0,ry=0;
function applyCursor(){
  curEls.forEach(function(e){e.remove()}); curEls=[];
  document.body.classList.remove("cursor-hide");
  var c=cfg.fx.cursor;
  if(c==="none"||window.matchMedia("(pointer:coarse)").matches) return;
  document.body.classList.add("cursor-hide");
  function mk(id){var d=el("div","cur");d.id=id;document.body.appendChild(d);curEls.push(d);return d}
  if(c==="dot"){ mk("curDot"); }
  if(c==="ring"){ mk("curDot"); mk("curRing"); }
  if(c==="glow"){ mk("curGlow"); mk("curDot"); }
  if(!curBound){
    curBound=true;
    window.addEventListener("mousemove",function(e){mx=e.clientX;my=e.clientY},{passive:true});
    (function loop(){
      rx+=(mx-rx)*.18; ry+=(my-ry)*.18;
      curEls.forEach(function(d){
        var lag = d.id==="curRing"||d.id==="curGlow";
        var x = lag?rx:mx, y = lag?ry:my;
        d.style.transform="translate3d("+x+"px,"+y+"px,0)";
      });
      requestAnimationFrame(loop);
    })();
  }
}

var audio=new Audio(), trackIdx=0, wantPlay=false;
audio.preload="auto";

var audioSig="";
function applyAudio(){
  var a=cfg.audio, bar=$("#audiobar");
  bar.setAttribute("data-pos",a.pos);
  bar.classList.toggle("on", !!(a.show && a.tracks.length));
  bar.innerHTML=
    '<button id="playBtn" aria-label="Lecture"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>'+
    '<div id="trackMeta"><div id="trackName"></div><div id="trackSub"></div></div>'+
    '<button id="skipBtn" class="'+(a.tracks.length>1?"on":"")+'" aria-label="Piste suivante"><svg viewBox="0 0 24 24"><path d="M6 5l9 7-9 7V5zm10 0h2v14h-2z"/></svg></button>'+
    '<input id="vol" type="range" min="0" max="100" aria-label="Volume">';

  var sig=a.tracks.length+"|"+a.tracks.map(function(t){return (t.src||"").length}).join(",");
  if(sig!==audioSig){
    audioSig=sig; trackIdx=0;
    if(!a.tracks.length){ audio.pause(); audio.removeAttribute("src"); }
    else audio.src=a.tracks[0].src;
  }
  if(!a.tracks.length) return;

  if(trackIdx>=a.tracks.length) trackIdx=0;
  showTrack(trackIdx);
  $("#vol").value=a.volume;
  audio.volume=a.volume/100;
  audio.loop = a.loop && a.tracks.length===1;
  $("#playBtn").onclick=function(){ audio.paused?play():pause() };
  $("#skipBtn").onclick=function(){ nextTrack(true) };
  $("#vol").oninput=function(){ audio.volume=this.value/100; set("audio.volume",+this.value); markDirty() };
  syncPlayIcon();
}
function showTrack(i){
  var t=cfg.audio.tracks[i]; if(!t) return;
  var n=$("#trackName"), s=$("#trackSub");
  if(n) n.textContent=t.name||"piste "+(i+1);
  if(s) s.textContent=t.artist||"";
}
function loadTrack(i,auto){
  var t=cfg.audio.tracks[i]; if(!t) return;
  trackIdx=i; audio.src=t.src; showTrack(i);
  if(auto) play();
}
function nextTrack(auto){
  var n=cfg.audio.tracks.length; if(!n) return;
  if(n===1){ if(cfg.audio.loop){audio.currentTime=0;play()} return; }
  loadTrack((trackIdx+1)%n, auto!==false);
}
function play(){ wantPlay=true; audio.play().then(syncPlayIcon).catch(function(){}); setTimeout(syncPlayIcon,120) }
function pause(){ wantPlay=false; audio.pause(); syncPlayIcon() }
function syncPlayIcon(){
  var b=$("#playBtn"); if(!b) return;
  b.innerHTML = audio.paused
    ? '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
}

function buildDoc(c){
  var json=JSON.stringify(c).replace(/</g,"\\u003c");
  return PRISTINE.replace(/(<script type="application\/json" id="cfg">)[\s\S]*?(<\/script>)/i,
    function(m,a,b){ return a+json+b });
}
var sizeT;
function updateSize(){
  clearTimeout(sizeT);
  sizeT=setTimeout(function(){
    var n; try{ n=new Blob([buildDoc(cfg)]).size }catch(e){ return }
    var pct=Math.min(100, n/(14*1024*1024)*100);
    var bar=$("#meterBar"); if(!bar) return;
    bar.style.width=pct+"%";
    bar.className = pct>85?"bad":pct>60?"warn":"";
    $("#meterTxt").textContent="Poids de la page · "+bytes(n)+" / 14 Mo";
  },400);
}

function downloadFile(){
  var html=buildDoc(cfg);
  try{
    var blob=new Blob([html],{type:"text/html;charset=utf-8"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download="index.html";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove() },1500);
    PUBLISHED=clone(cfg); clearDraft(); markDirty();
    toast("index.html téléchargé.");
  }catch(e){ toast("Téléchargement impossible dans ce contexte.") }
}

async function publish(){
  if(!ART){ toast("Publication indisponible ici."); return; }
  var html=buildDoc(cfg);
  if(new Blob([html]).size > 15*1024*1024){
    toast("Page trop lourde. Allège les médias."); return;
  }
  var btn=$("#pubBtn"); btn.disabled=true; btn.textContent="Publication…";
  try{
    sessionStorage.setItem("biolink.panel","1");
    await ART.publish(html);
    clearDraft();
    toast("Publié.");
  }catch(err){
    try{ sessionStorage.removeItem("biolink.panel") }catch(e){}
    btn.disabled=false; btn.textContent="Publier";
    if(err && err.code==="conflict") toast("Une autre version a été publiée. Recharge la page.");
    else if(err && (err.code==="not_granted"||err.code==="not_writer")) toast("Tu n'as pas les droits d'édition.");
    else toast("Échec de la publication.");
  }
}

/* =======================================================================
   13. CONSTRUCTION DU PANEL
   ======================================================================= */
var curTab="profil";

function panelShell(){
  var p=$("#panel");
  p.innerHTML=
   '<div class="ph">'+
     '<h2>Configuration</h2>'+
     '<span class="status" id="status"><i></i><span id="statusTxt">En ligne</span></span>'+
     '<button class="iconbtn" id="closeP" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
   '</div>'+
   '<div class="tabs" id="tabs"></div>'+
   '<div class="body" id="pbody"></div>'+
   '<div class="pf">'+
     '<div class="meter"><div class="t" id="meterTxt">Poids de la page</div><div class="bar"><i id="meterBar"></i></div></div>'+
     '<button class="btn" id="revertBtn">Annuler</button>'+
     '<button class="btn pri" id="pubBtn">Publier</button>'+
   '</div>';
  $("#closeP").onclick=closePanel;
  $("#revertBtn").onclick=function(){
    if(!confirm("Revenir à la dernière version publiée ?")) return;
    cfg=clone(PUBLISHED); clearDraft(); applyAll(); buildPanel(); markDirty(); updateSize(); toast("Modifications annulées.");
  };
  $("#pubBtn").onclick=function(){ mode==="static" ? downloadFile() : publish() };

  var tabs=$("#tabs");
  SCHEMA.forEach(function(s){
    var b=el("button","tab"+(s.id===curTab?" sel":""),s.label);
    b.onclick=function(){ curTab=s.id; buildPanel(); };
    tabs.appendChild(b);
  });
}

function buildPanel(){
  if(!$("#pbody")) panelShell();
  $("#tabs").querySelectorAll(".tab").forEach(function(b,i){ b.classList.toggle("sel",SCHEMA[i].id===curTab) });
  var body=$("#pbody"); body.innerHTML="";
  var sec=SCHEMA.filter(function(s){return s.id===curTab})[0];
  sec.rows.forEach(function(r){
    if(r.when && !r.when()) return;
    var node=buildRow(r);
    if(node) body.appendChild(node);
  });
  updateStatus();
  updateSize();
}

function changed(rebuild){
  applyAll();
  markDirty();
  updateSize();
  if(rebuild) buildPanel();
}

function buildRow(r){
  if(r.t==="links") return linksWidget();
  if(r.t==="tracks") return tracksWidget();
  if(r.t==="data") return dataWidget();
  if(r.t==="note") return el("div","hint",r.s);
  if(r.t==="button"){
    var w=el("div","row stack");
    var b=el("button","btn full"+(r.danger?" danger":""),r.l);
    b.onclick=r.act; w.appendChild(b); return w;
  }

  var row=el("div","row");
  var lab=el("div","lab");
  lab.appendChild(el("b",null,r.l));
  if(r.s) lab.appendChild(el("span",null,r.s));
  row.appendChild(lab);
  var ctl=el("div","ctl");
  var v=get(r.k);

  if(r.t==="text"){
    var i=el("input"); i.type="text"; i.value=v||""; if(r.ph)i.placeholder=r.ph;
    i.oninput=function(){ set(r.k,this.value); changed(false) };
    ctl.appendChild(i);
  }
  else if(r.t==="area"){
    row.className="row stack"; row.innerHTML=""; row.appendChild(lab);
    var ta=el("textarea"); ta.value=v||"";
    ta.oninput=function(){ set(r.k,this.value); changed(false) };
    row.appendChild(ta); return row;
  }
  else if(r.t==="select"){
    var s=el("select");
    r.opts.forEach(function(o){ var op=el("option",null,o[1]); op.value=o[0]; if(o[0]===v)op.selected=true; s.appendChild(op) });
    s.onchange=function(){ set(r.k,this.value); changed(true) };
    ctl.appendChild(s);
  }
  else if(r.t==="seg"){
    var g=el("div","seg");
    r.opts.forEach(function(o){
      var b=el("button",o[0]===v?"sel":"",o[1]);
      b.onclick=function(){ set(r.k,o[0]); changed(true) };
      g.appendChild(b);
    });
    ctl.appendChild(g);
  }
  else if(r.t==="toggle"){
    var sw=el("button","sw"+(v?" on":"")); sw.setAttribute("aria-pressed",!!v);
    sw.onclick=function(){ set(r.k,!get(r.k)); changed(true) };
    ctl.appendChild(sw);
  }
  else if(r.t==="range"){
    var g2=el("div","rng");
    var inp=el("input"); inp.type="range"; inp.min=r.min; inp.max=r.max; inp.step=r.step; inp.value=v;
    var out=el("span","val",v+(r.unit||""));
    inp.oninput=function(){ out.textContent=this.value+(r.unit||""); set(r.k,+this.value); changed(false) };
    g2.appendChild(inp); g2.appendChild(out); ctl.appendChild(g2);
  }
  else if(r.t==="color"){
    var g3=el("div","clr");
    var ci=el("input"); ci.type="color"; ci.value=v;
    var tx=el("input"); tx.type="text"; tx.value=v;
    ci.oninput=function(){ tx.value=this.value; set(r.k,this.value); changed(false) };
    tx.oninput=function(){ if(/^#[0-9a-f]{6}$/i.test(this.value)){ ci.value=this.value; set(r.k,this.value); changed(false) } };
    g3.appendChild(ci); g3.appendChild(tx); ctl.appendChild(g3);
  }
  else if(r.t==="media"){
    row.className="row stack"; row.innerHTML=""; row.appendChild(lab);
    row.appendChild(mediaDrop(r,v));
    return row;
  }
  row.appendChild(ctl);
  return row;
}

/* --- média --- */
function mediaDrop(r,v){
  var d=el("div","drop");
  var th=el("div","thumb");
  if(v){
    if(r.kind==="video"){ var vd=el("video"); vd.src=v; vd.muted=true; th.appendChild(vd) }
    else { var im=el("img"); im.src=v; th.appendChild(im) }
  } else th.textContent="vide";
  var t=el("div","t");
  t.innerHTML = v ? "Fichier chargé<small>"+bytes(Math.round(v.length*0.75))+" · clique pour remplacer</small>"
                  : "Choisir un fichier<small>"+(r.s||"max "+r.max+" Mo")+"</small>";
  d.appendChild(th); d.appendChild(t);
  if(v){
    var x=el("button","x","×"); x.title="Retirer";
    x.onclick=function(ev){ ev.stopPropagation(); set(r.k,""); changed(true) };
    d.appendChild(x);
  }
  d.onclick=function(){
    var inp=el("input"); inp.type="file";
    inp.accept = r.kind==="video" ? "video/mp4,video/webm" : "image/*";
    inp.onchange=function(){
      var f=inp.files[0]; if(!f) return;
      if(f.size > r.max*1024*1024){ toast("Fichier trop lourd (max "+r.max+" Mo)."); return; }
      if(r.kind==="video"||f.type==="image/gif"){ toDataURL(f,function(u){ set(r.k,u); changed(true) }) }
      else shrink(f, r.k==="profile.avatar"?512:1920, function(u){ set(r.k,u); changed(true) });
    };
    inp.click();
  };
  return d;
}
function toDataURL(f,cb){ var fr=new FileReader(); fr.onload=function(){cb(fr.result)}; fr.readAsDataURL(f) }
function shrink(file,maxW,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var sc=Math.min(1,maxW/img.width);
      var c=document.createElement("canvas");
      c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      var out=c.toDataURL("image/webp",.88);
      if(out.indexOf("data:image/webp")!==0) out=c.toDataURL("image/jpeg",.86);
      cb(out);
    };
    img.onerror=function(){ cb(fr.result) };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

/* --- liens --- */
function linksWidget(){
  var wrap=el("div");
  wrap.appendChild(el("div","hint","Laisse une URL vide pour masquer le lien. L'ordre ici est celui de la page."));
  cfg.links.forEach(function(l,i){
    var r=el("div","lkrow");
    var s=el("select");
    PKEYS.forEach(function(k){ var o=el("option",null,P[k][0]); o.value=k; if(k===l.p)o.selected=true; s.appendChild(o) });
    s.onchange=function(){ cfg.links[i].p=this.value; changed(true) };
    var u=el("input"); u.type="text"; u.placeholder="https://…"; u.value=l.u||"";
    u.oninput=function(){ cfg.links[i].u=this.value; changed(false) };
    var up=el("button","mini","↑"); up.title="Monter";
    up.onclick=function(){ if(i===0)return; var t=cfg.links[i-1]; cfg.links[i-1]=cfg.links[i]; cfg.links[i]=t; changed(true) };
    var dn=el("button","mini","↓"); dn.title="Descendre";
    dn.onclick=function(){ if(i===cfg.links.length-1)return; var t=cfg.links[i+1]; cfg.links[i+1]=cfg.links[i]; cfg.links[i]=t; changed(true) };
    var del=el("button","mini del","×"); del.title="Supprimer";
    del.onclick=function(){ cfg.links.splice(i,1); changed(true) };
    [s,u,up,dn,del].forEach(function(n){r.appendChild(n)});
    wrap.appendChild(r);
  });
  var add=el("div","row stack");
  var b=el("button","btn full","+ Ajouter un lien");
  b.onclick=function(){ cfg.links.push({p:"link",u:""}); changed(true) };
  add.appendChild(b); wrap.appendChild(add);
  return wrap;
}

/* --- pistes audio --- */
function tracksWidget(){
  var wrap=el("div");
  wrap.appendChild(el("div","hint","L'audio est intégré à la page : chaque piste alourdit le chargement. <b>Vise moins de 3 Mo par piste.</b>"));
  cfg.audio.tracks.forEach(function(t,i){
    var r=el("div","lkrow");
    var n=el("input"); n.type="text"; n.placeholder="titre"; n.value=t.name||"";
    n.oninput=function(){ cfg.audio.tracks[i].name=this.value; changed(false) };
    var a=el("input"); a.type="text"; a.placeholder="artiste"; a.value=t.artist||"";
    a.oninput=function(){ cfg.audio.tracks[i].artist=this.value; changed(false) };
    var sz=el("span","mini",""); sz.textContent=bytes(Math.round((t.src||"").length*0.75)).replace(" ","");
    sz.style.cssText="width:auto;flex:0 0 auto;padding:0 7px;font-size:10.5px;cursor:default";
    var del=el("button","mini del","×"); del.title="Retirer";
    del.onclick=function(){ cfg.audio.tracks.splice(i,1); changed(true) };
    [n,a,sz,del].forEach(function(x){r.appendChild(x)});
    wrap.appendChild(r);
  });
  var add=el("div","row stack");
  var b=el("button","btn full","+ Ajouter une piste");
  b.onclick=function(){
    var inp=el("input"); inp.type="file"; inp.accept="audio/*";
    inp.onchange=function(){
      var f=inp.files[0]; if(!f) return;
      if(f.size>6*1024*1024){ toast("Piste trop lourde (max 6 Mo)."); return; }
      toDataURL(f,function(u){
        cfg.audio.tracks.push({src:u,name:f.name.replace(/\.[^.]+$/,""),artist:""});
        changed(true);
      });
    };
    inp.click();
  };
  add.appendChild(b); wrap.appendChild(add);
  return wrap;
}

/* --- import / export --- */
function dataWidget(){
  var wrap=el("div","row stack");
  var lab=el("div","lab"); lab.appendChild(el("b",null,"Sauvegarde"));
  lab.appendChild(el("span",null,"Copie ce texte pour garder une trace, ou colle-en un pour restaurer."));
  wrap.appendChild(lab);
  var ta=el("textarea"); ta.value=JSON.stringify(cfg);
  ta.style.fontSize="11px"; ta.style.minHeight="64px";
  wrap.appendChild(ta);
  var bar=el("div"); bar.style.cssText="display:flex;gap:8px;margin-top:9px";
  var c=el("button","btn","Copier");
  c.onclick=function(){ ta.select(); try{document.execCommand("copy")}catch(e){} toast("Copié.") };
  var im=el("button","btn","Restaurer");
  im.onclick=function(){
    try{
      var o=JSON.parse(ta.value);
      cfg=deepMerge(DEFAULTS,o); applyAll(); buildPanel(); markDirty(); updateSize(); toast("Configuration restaurée.");
    }catch(e){ toast("Ce texte n'est pas une sauvegarde valide.") }
  };
  bar.appendChild(c); bar.appendChild(im); wrap.appendChild(bar);
  return wrap;
}

/* =======================================================================
   14. OUVERTURE / FERMETURE
   ======================================================================= */
function openPanel(){
  buildPanel();
  $("#panel").classList.add("open");
  if(window.innerWidth>900) $("#stage").style.transform="translateX(-"+Math.min(180,window.innerWidth*.14)+"px)";
}
function closePanel(){
  $("#panel").classList.remove("open");
  $("#stage").style.transform="";
  try{ sessionStorage.removeItem("biolink.panel") }catch(e){}
}
function updateStatus(){
  var g=$("#gear"); if(g) g.classList.toggle("dirty",dirty);
  var s=$("#status"); if(!s) return;
  s.classList.toggle("dirty",dirty);
  var pb=$("#pubBtn");
  if(mode==="static"){
    $("#statusTxt").textContent = dirty ? "Modifié" : "Exporté";
    if(pb){ pb.disabled=false; pb.textContent="Télécharger"; pb.title="Télécharge index.html à mettre sur GitHub"; }
  } else {
    $("#statusTxt").textContent = dirty ? "Non publié" : "En ligne";
    if(pb){ pb.disabled=!dirty; pb.textContent="Publier"; pb.title=""; }
  }
}
$("#gear").onclick=function(){ $("#panel").classList.contains("open")?closePanel():openPanel() };
document.addEventListener("keydown",function(e){
  if(e.key==="Escape" && $("#panel").classList.contains("open")) closePanel();
  if((e.ctrlKey||e.metaKey) && e.shiftKey && (e.key==="e"||e.key==="E") && mode!=="visitor"){ e.preventDefault(); openPanel() }
});

/* =======================================================================
   15. DEMARRAGE
   ======================================================================= */
applyAll();

(async function boot(){
  var hashAdmin = /admin/i.test(location.hash);
  if(window.claude && typeof window.claude.use==="function"){
    try{ USER = await window.claude.use("user") }catch(e){}
    var owner = !!(USER && ((USER.isOwner&&USER.isOwner()) || (USER.canEdit&&USER.canEdit())));
    if(owner){
      mode="owner";
      try{ ART = await window.claude.use("artifact") }catch(e){}
    } else {
      mode = hashAdmin ? "static" : "visitor";
    }
  } else {
    mode = hashAdmin ? "static" : "visitor";
  }
  if(mode==="visitor"){
    if(dirty){ cfg=clone(PUBLISHED); dirty=false; applyAll(); }
    return;
  }
  $("#gear").classList.add("on");
  $("#gear").innerHTML='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>';
  panelShell();
  updateStatus();
  try{ if(sessionStorage.getItem("biolink.panel")==="1") openPanel() }catch(e){}
})();
